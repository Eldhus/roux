# roux's build, against fourneau's master: on every push to master, its
# tests and the release's build (tools/release.sh), as a check; on a
# pushed vVERSION tag, that build published as the release app authors
# name (README, "Use a release"). The drag race builds roux from master
# itself, so nothing else is
# published. No secrets: a release is made with this run's own token.
name: build
on:
  push:
    branches: [master]
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    if: github.repository == 'Eldhus/roux'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: roux
      # roux's build.zig.zon depends on ../fourneau.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Eldhus/fourneau
          ref: master
          path: fourneau
      # toolchain.json's downloads, each checked by SHA-256, unpacked where
      # a developer's machine keeps them, so build.zig and tools/release.sh
      # find them as there; musl's two files into platform/targets.
      - name: The toolchain
        run: |
          pins=roux/toolchain.json
          zig_version=$(jq -r .zig.version $pins)
          roc_version=$(jq -r .roc.version $pins)
          if [ "$zig_version" != "$(cat roux/.zig-version)" ] || [ "$roc_version" != "$(cat roux/.roc-version)" ]; then
            echo "toolchain.json names zig $zig_version and roc $roc_version; .zig-version and .roc-version disagree" >&2
            exit 1
          fi
          fetch() {
            curl -fsSL --retry 5 -o "$RUNNER_TEMP/$2" "$(jq -r ".$1.url" $pins)"
            echo "$(jq -r ".$1.sha256" $pins)  $RUNNER_TEMP/$2" | sha256sum -c -
          }
          fetch zig zig.tar.xz
          mkdir -p ~/.local/share/zig ~/.local/share/roc-nightly
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C ~/.local/share/zig
          fetch roc roc.tar.gz
          tar -xzf "$RUNNER_TEMP/roc.tar.gz" -C ~/.local/share/roc-nightly
          echo "$HOME/.local/share/roc-nightly/roc_nightly-linux_x86_64-${roc_version#nightly-}" >> "$GITHUB_PATH"
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/roc-source.tar.gz" "$(jq -r .roc_musl.url $pins)"
          mkdir -p "$RUNNER_TEMP/roc-source" roux/platform/targets/x64musl
          jq -r '.roc_musl.files | keys[] | "*/" + .' $pins |
            xargs tar -xzf "$RUNNER_TEMP/roc-source.tar.gz" -C "$RUNNER_TEMP/roc-source" --strip-components=1 --wildcards
          jq -r '.roc_musl.files | to_entries[] | "\(.value)  \(.key)"' $pins |
            (cd "$RUNNER_TEMP/roc-source" && sha256sum -c -)
          jq -r '.roc_musl.files | keys[]' $pins |
            while read -r path; do cp "$RUNNER_TEMP/roc-source/$path" roux/platform/targets/x64musl/; done
      - name: Test
        working-directory: roux
        run: ~/.local/share/zig/zig-x86_64-linux-$(cat .zig-version)/zig build test
      - name: Build
        working-directory: roux
        run: tools/release.sh
      - if: startsWith(github.ref, 'refs/tags/v')
        name: Release
        working-directory: roux
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${GITHUB_REF#refs/tags/}
          if [ ! -e "dist/roux-${tag#v}-x86_64-linux.tar.gz" ]; then
            echo "the tag $tag is not build.zig.zon's version:" dist/* >&2
            exit 1
          fi
          gh release create "$tag" --title "roux ${tag#v}" --notes "roux ${tag#v}: README, \"Use a release\"." --latest dist/*
